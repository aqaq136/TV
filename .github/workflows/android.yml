name: Android checks

on:
  push:
    branches: [MetoxTV, metoxtv, codex/metoxtv-4-visual]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build, test and lint
        run: bash ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease :efir-tv:assembleDebug --no-daemon --max-workers=2
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Save CI APK (separate signing key; fresh installs only)
        uses: actions/upload-artifact@v4
        with:
          name: MetoxTV-CI-fresh-install
          path: app/build/outputs/apk/release/app-release.apk
