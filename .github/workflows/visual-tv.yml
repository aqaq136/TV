name: Android TV visual checks

on:
  push:
    branches: [codex/metoxtv-4-visual, codex/metoxtv-4.0.1-russian, codex/metoxtv-4.0.2-weather]
    paths: ['app/**', 'tools/verify-tv.sh']
  pull_request:
    paths: ['app/**', '.github/workflows/visual-tv.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv:
    if: github.event_name != 'pull_request' || (github.head_ref != 'codex/metoxtv-4-visual' && github.head_ref != 'codex/metoxtv-4.0.1-russian' && github.head_ref != 'codex/metoxtv-4.0.2-weather')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android TV 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080
          script: bash tools/verify-tv.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MetoxTV-TV-screenshots
          path: work/tv-screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-TV-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  publish-preview:
    needs: tv
    if: github.event_name == 'push' && (github.ref_name == 'codex/metoxtv-4-visual' || github.ref_name == 'codex/metoxtv-4.0.1-russian' || github.ref_name == 'codex/metoxtv-4.0.2-weather')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: MetoxTV-TV-screenshots
          path: work/rendered
      - name: Save actual emulator captures in a separate preview branch
        env:
          PREVIEW_BRANCH: codex/tv-preview-${{ github.run_id }}
        run: |
          mkdir -p docs/screenshots
          cp work/rendered/* docs/screenshots/
          git switch -c "$PREVIEW_BRANCH"
          git add docs/screenshots
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Capture actual Android TV 9 visual previews'
          git push origin "$PREVIEW_BRANCH"
