name: Android TV visual checks

on:
  push:
    branches: [codex/metoxtv-4-visual]
  pull_request:
    paths: ['app/**', '.github/workflows/visual-tv.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android TV 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080
          script: |
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p work/tv-screenshots
          adb pull /sdcard/Android/data/com.gathin.tvhome/files/screenshots/. work/tv-screenshots/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-TV-4.0-screenshots-and-tests
          path: |
            work/tv-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
